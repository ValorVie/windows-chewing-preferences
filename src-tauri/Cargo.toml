[package]
name = "chewing-preferences"
version = "26.6.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chewing_preferences_lib"

[[bin]]
name = "ChewingPreferences"
path = "src/main.rs"

[dependencies]
chewing = "0.13.0-alpha.2"
chewing_tip_core = { git = "https://codeberg.org/chewing/windows-chewing-tsf" }
log = "0.4"
scoped-error = "0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
toml = "0.9.5"
windows = {
  version = "0.61.0",
  features = [
    "Win32_Graphics_DirectWrite",
  ]
}

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch."https://codeberg.org/chewing/windows-chewing-tsf"]
chewing_tip_core = { path = "../../windows-chewing-tsf/crates/chewing_tip_core" }

[dev-dependencies]
windows = { version = "0.61.0", features = ["Win32_System_Registry"] }
windows-registry = "0.6.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
